name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Konusbitr is self-hosted software; the build should not phone home either.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build

  # The cross-language contract. The Zod schemas in `packages/shared` are the
  # source of truth and the worker's pydantic models are generated from them;
  # drift between the two is the main failure mode of a two-runtime
  # architecture, so regenerating has to be a no-op on a clean tree.
  contract:
    name: Contract codegen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm codegen
        run: pnpm codegen

      - name: The generated contract is up to date
        run: |
          if ! git diff --exit-code; then
            echo
            echo "The pydantic models have drifted from the Zod schemas."
            echo "Run 'pnpm codegen' and commit the result."
            exit 1
          fi

  # Testcontainers-backed tests: the schema against a real Postgres, a real
  # Better Auth against Postgres and Redis, and the Phase 06 seam — which
  # enqueues from TypeScript and runs the actual Python worker against the same
  # containers. Separate from the TypeScript job because it needs a Docker
  # daemon and takes minutes rather than seconds.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The worker integration test starts `python -m konusbitr_worker` as a
      # child process, so this job needs the Python toolchain as well.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync the worker environment
        run: uv sync --locked --project services/worker

      - name: Integration tests
        run: pnpm turbo run test:integration

      # The retrieval gate. It starts its own Postgres through Testcontainers,
      # indexes the fixture corpus and runs the real `retrieve()`, so it belongs
      # with the other Docker-dependent jobs rather than in the fast lane.
      #
      # No `--write`: the recorded baseline in `evals/RESULTS.md` is a reviewed
      # artefact, and a CI run that rewrote it would both dirty the tree and
      # quietly re-baseline the very regression it exists to catch.
      - name: Retrieval evaluation regression gate
        run: pnpm eval:retrieval

      # The gate has to be able to fail. `--broken-chunker` re-indexes the same
      # corpus with fixed-width windows and smeared page provenance — a real
      # chunking change, not a counter — and recall drops far past the 2-point
      # margin. If this step *succeeds*, the gate above is not measuring
      # anything and the build should go red.
      - name: The regression gate catches a broken chunker
        run: |
          if pnpm eval:retrieval -- --broken-chunker; then
            echo "::error::a deliberately broken chunker passed the regression gate"
            exit 1
          fi
          echo "the regression gate rejected the broken chunker, as it should"

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The worker is the Python half of the pipeline, and the suite waits for a
      # document to reach `ready` — so it has to actually run.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync the worker environment
        run: uv sync --locked --project services/worker

      - name: Install the browser
        run: pnpm --filter @konusbitr/web exec playwright install --with-deps chromium

      # Postgres, Redis and MinIO in containers, schema applied. The web server
      # itself is started by Playwright, from a production build.
      - name: Backing services
        run: |
          cp .env.example .env
          pnpm dev:infra

      - name: Worker
        run: |
          set -a; . ./.env; set +a
          nohup uv run --project services/worker python -m konusbitr_worker > worker.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8081/ready > /dev/null && exit 0
            sleep 2
          done
          echo "::error::the worker never became ready"
          cat worker.log
          exit 1

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Worker log
        if: failure()
        run: cat worker.log || true

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/e2e/.results
          retention-days: 7

      - name: Teardown
        if: always()
        run: pnpm infra:down

  python:
    name: Python worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/worker/uv.lock

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  infra:
    name: Backing services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Errors only. This phase is shell-heavy and a real bug here breaks a
      # self-hoster's first command; style opinions are not worth a red build.
      - name: Shell check
        run: |
          shellcheck --severity=error \
            scripts/infra.sh scripts/dev.sh \
            docker/minio/init.sh docker/ollama/pull-models.sh

      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile local-llm config --quiet

      # This is the `pnpm dev:infra` path: backing services in containers, app
      # code native. It has to publish every port on localhost, because that is
      # what a natively-run web app and worker connect to.
      - name: pnpm dev:infra
        run: ./scripts/infra.sh up

      - name: Every backing service is reachable from the host
        run: |
          for port in 5432 6379 9000 9001; do
            nc -z localhost "$port" || { echo "nothing listening on $port"; exit 1; }
          done

      - name: Postgres has the extensions the pipeline needs
        run: |
          extensions=$(docker compose exec -T postgres \
            psql -U konusbitr -d konusbitr -tAc 'SELECT extname FROM pg_extension ORDER BY 1')
          echo "$extensions"
          for extension in vector pg_trgm unaccent; do
            echo "$extensions" | grep -qx "$extension" \
              || { echo "missing extension: $extension"; exit 1; }
          done

      - name: The konusbitr bucket exists
        run: |
          docker compose run --rm --entrypoint /bin/sh minio-init -c '
            mc alias set probe "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null
            mc ls "probe/$S3_BUCKET"
          '

      - name: The schema is applied, so a native dev loop can sign someone up
        run: |
          tables=$(docker compose exec -T postgres \
            psql -U konusbitr -d konusbitr -tAc \
            "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY 1")
          echo "$tables"
          for table in users organizations memberships documents chunks; do
            echo "$tables" | grep -qx "$table" \
              || { echo "missing table: $table"; exit 1; }
          done

      - name: Bootstrap is idempotent
        run: ./scripts/infra.sh up

      - name: Ollama serves on 11434 under the local-llm profile
        run: |
          # Only the server: pulling models would cost gigabytes, and
          # `ollama-init` is exercised by self-hosters rather than by CI.
          docker compose --profile local-llm up -d ollama
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:11434/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:11434/

      - name: Teardown
        if: always()
        run: ./scripts/infra.sh reset

  images:
    name: Image ${{ matrix.image }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, migrate]
        # Native runners rather than QEMU: emulated `next build` takes long
        # enough to time the job out. `ubuntu-24.04-arm` is free for public
        # repositories.
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform.arch }}

  compose:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Exactly the two commands the README promises a self-hoster, with nothing
      # else in between. If this step ever needs a workaround, the workaround
      # belongs in the Compose file instead.
      - name: cp .env.example .env && docker compose up
        run: |
          cp .env.example .env
          docker compose up -d --build
          ./scripts/infra.sh wait

      # The Phase 03 promise: no manual `pnpm db:migrate` between `docker compose
      # up` and a working signup. `wait` above already fails the job if the
      # one-shot exited non-zero; this asserts it did the work.
      - name: Migrations ran before the web app started
        run: |
          docker compose logs --no-color migrate
          applied=$(docker compose exec -T postgres \
            psql -U konusbitr -d konusbitr -tAc \
            'SELECT count(*) FROM drizzle.__drizzle_migrations')
          echo "applied migrations: $applied"
          test "$applied" -gt 0

      - name: Signing up reaches the database rather than a missing table
        run: |
          status=$(curl -s -o /tmp/signup.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/sign-up/email \
            -H 'content-type: application/json' \
            -d '{"name":"CI","email":"ci@example.com","password":"correct-horse-battery"}')
          echo "$status"; cat /tmp/signup.json
          test "$status" = 200

      - name: GET /api/health returns ok
        run: |
          body=$(curl -fsS http://localhost:3000/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: The worker is healthy
        run: |
          status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q worker)")
          echo "worker: $status"
          test "$status" = healthy

      - name: The worker reports itself healthy and ready over HTTP
        run: |
          health=$(curl -fsS http://localhost:8081/health)
          echo "$health"
          echo "$health" | grep -q '"ok":true'

          ready=$(curl -fsS http://localhost:8081/ready)
          echo "$ready"
          echo "$ready" | grep -q '"ok":true'

      # The Phase 06 seam, through the real Compose stack: a job enqueued onto
      # the Redis stream is consumed by the Python worker and the document it
      # names reaches `ready`. Everything above this proves the containers
      # start; this proves they talk to each other.
      - name: A job enqueued on the stream drives a document to ready
        run: |
          set -euo pipefail

          hash=$(sha256sum fixtures/pdf/clean-text-10p.pdf | awk '{print $1}')
          settings=$(printf 'b%.0s' $(seq 64))
          size=$(wc -c < fixtures/pdf/clean-text-10p.pdf | tr -d ' ')

          docker compose run --rm -T --entrypoint /bin/sh minio-init -c '
            mc alias set probe "$MINIO_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null
            mc pipe "probe/$S3_BUCKET/orgs/org_ci/documents/doc_ci/original.pdf" > /dev/null
          ' < fixtures/pdf/clean-text-10p.pdf

          docker compose exec -T postgres psql -U konusbitr -d konusbitr -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO organizations (id, name, slug) VALUES ('org_ci', 'CI Worker', 'ci-worker') ON CONFLICT (id) DO NOTHING;
          INSERT INTO documents (
            id, org_id, filename, mime, byte_size, page_count,
            storage_key, content_hash, settings_hash, status
          ) VALUES (
            'doc_ci', 'org_ci', 'clean-text-10p.pdf', 'application/pdf', $size, 10,
            'orgs/org_ci/documents/doc_ci/original.pdf',
            '$hash', '$settings', 'queued'
          );
          INSERT INTO jobs (id, org_id, document_id, type, status, stage)
          VALUES ('job_ci', 'org_ci', 'doc_ci', 'parse', 'pending', 'queued');
          SQL

          payload=$(printf '%s' \
            '{"v":1,"jobId":"job_ci","type":"parse","orgId":"org_ci",' \
            '"documentId":"doc_ci",' \
            '"storageKey":"orgs/org_ci/documents/doc_ci/original.pdf",' \
            "\"contentHash\":\"$hash\"," \
            '"settings":{"quality":"standard","langList":[],"llm":false},' \
            '"attempt":1,"enqueuedAt":"2026-01-01T00:00:00Z"}')

          docker compose exec -T redis redis-cli XADD konusbitr:jobs '*' payload "$payload"

          status=""
          for _ in $(seq 1 60); do
            status=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
              "SELECT status FROM documents WHERE id = 'doc_ci'")
            echo "document: $status"
            [ "$status" = "ready" ] && break
            sleep 2
          done
          test "$status" = "ready"

          # Exactly one parse result: the docId cache is a unique constraint,
          # and a job that ran twice would have tried to write a second.
          parses=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM parse_results WHERE document_id = 'doc_ci'")
          test "$parses" -eq 1

          # Pages were written for all 10 pages.
          pages=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM pages WHERE document_id = 'doc_ci'")
          test "$pages" -eq 10

          # Chunks were written and the document knows how many. The default
          # `.env` configures no embedding model, so they have no vectors: the
          # passages are keyword-searchable and a `reindex` fills the vectors in
          # once a model is named. That degradation is asserted rather than
          # merely documented, because it is what keeps `cp .env.example .env &&
          # docker compose up` a stack that finishes a job.
          chunks=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM chunks WHERE document_id = 'doc_ci'")
          echo "chunks: $chunks"
          test "$chunks" -gt 0

          vectors=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(embedding) FROM chunks WHERE document_id = 'doc_ci'")
          test "$vectors" -eq 0

          counts=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT chunks_ready || '/' || chunks_total FROM documents WHERE id = 'doc_ci'")
          echo "chunks ready: $counts"
          test "$counts" = "0/$chunks"

          # Every chunk knows where it came from. An uncitable chunk is the
          # failure this product exists to prevent, so the column is NOT NULL
          # and this asserts the worker actually fills it.
          unlocated=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM chunks WHERE document_id = 'doc_ci' AND jsonb_array_length(pages) = 0")
          test "$unlocated" -eq 0

          # Ordinals are dense from zero: they are the upsert key, and a gap
          # would mean a re-run left stale rows behind.
          ordinals=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(DISTINCT ordinal) = max(ordinal) + 1 FROM chunks WHERE document_id = 'doc_ci'")
          test "$ordinals" = "t"

          # Nothing left in the consumer group: the entry was acknowledged.
          pending=$(docker compose exec -T redis redis-cli \
            XPENDING konusbitr:jobs konusbitr:workers | head -1)
          echo "pending: $pending"
          test "$pending" -eq 0

      # Phase 08's idempotency criterion, through the real stack: the same job
      # delivered a second time must not double anything, and a `reindex` must
      # rebuild the index without re-running Docling.
      - name: A redelivered job doubles nothing, and a reindex skips the parse
        run: |
          set -euo pipefail

          hash=$(sha256sum fixtures/pdf/clean-text-10p.pdf | awk '{print $1}')
          before=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM chunks WHERE document_id = 'doc_ci'")

          payload_for() {
            printf '%s' \
              "{\"v\":1,\"jobId\":\"job_ci_$1\",\"type\":\"$1\",\"orgId\":\"org_ci\"," \
              '"documentId":"doc_ci",' \
              '"storageKey":"orgs/org_ci/documents/doc_ci/original.pdf",' \
              "\"contentHash\":\"$hash\"," \
              '"settings":{"quality":"standard","langList":[],"llm":false},' \
              '"attempt":1,"enqueuedAt":"2026-01-01T00:00:00Z"}'
          }

          for job_type in parse reindex; do
            docker compose exec -T postgres psql -U konusbitr -d konusbitr -v ON_ERROR_STOP=1 -c \
              "INSERT INTO jobs (id, org_id, document_id, type, status, stage)
               VALUES ('job_ci_$job_type', 'org_ci', 'doc_ci', '$job_type', 'pending', 'queued')
               ON CONFLICT (id) DO NOTHING"
            docker compose exec -T redis redis-cli XADD konusbitr:jobs '*' payload "$(payload_for "$job_type")"
          done

          for _ in $(seq 1 60); do
            done_count=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
              "SELECT count(*) FROM jobs WHERE id IN ('job_ci_parse','job_ci_reindex') AND status = 'succeeded'")
            echo "finished: $done_count"
            [ "$done_count" = "2" ] && break
            sleep 2
          done
          test "$done_count" = "2"

          # One parse result, still: the docId cache is a unique constraint and
          # neither job re-parsed.
          parses=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM parse_results WHERE content_hash = '$hash'")
          test "$parses" -eq 1

          # And the same number of chunks: the re-delivered parse skipped an
          # index that already existed, and the reindex replaced it row for row.
          after=$(docker compose exec -T postgres psql -U konusbitr -d konusbitr -tAc \
            "SELECT count(*) FROM chunks WHERE document_id = 'doc_ci'")
          echo "chunks before=$before after=$after"
          test "$after" -eq "$before"

      - name: A missing variable stops the web container, and says which
        run: |
          if output=$(docker compose run --rm --no-deps -e DATABASE_URL= web 2>&1); then
            echo "expected a non-zero exit"; echo "$output"; exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'DATABASE_URL: is required but was not set'

      - name: A missing variable stops the worker container, and says which
        run: |
          if output=$(docker compose run --rm --no-deps -e REDIS_URL= worker 2>&1); then
            echo "expected a non-zero exit"; echo "$output"; exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'REDIS_URL: is required but was not set'

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down --remove-orphans --volumes
