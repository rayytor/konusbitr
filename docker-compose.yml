# Konusbitr, self-hosted.
#
#   cp .env.example .env && docker compose up
#
# That is the whole setup. This file is a headline feature of the project, not
# developer convenience — a self-hoster's first impression is whether one
# command produces a working stack — so it carries no manual steps, no
# post-install shell, and no assumptions about the host beyond Docker itself.
#
# Profiles:
#   (default)   postgres, redis, minio, minio-init, migrate, web, worker
#   local-llm   adds Ollama and pre-pulls a chat + embedding model, which is
#               what makes OFFLINE_MODE=true a real claim rather than a flag
#   advanced    swaps the worker for one built from the `worker-advanced`
#               Dockerfile stage, which installs the AGPL-3.0 and GPL-3.0
#               parsers (PyMuPDF, Surya, Marker). **It replaces the default
#               worker rather than joining it**, so it is two settings and not
#               one:
#
#                   WORKER_REPLICAS=0 docker compose --profile advanced up
#
#               Both consume the same Redis consumer group, so leaving the
#               default worker running would split jobs between an image that
#               has the advanced parsers and one that does not — and a document
#               would then be parsed differently depending on which container
#               happened to claim it. That is worse than either image alone.
#
#               The default images must stay cleanly Apache-2.0 compatible and
#               `pnpm audit:licenses` asserts it, so nothing may be added to the
#               services below that would pull those packages in. Building the
#               advanced image changes the licence of what you built; see
#               `docs/licensing.md`.
#
# Ports, credentials and model names all come from `.env`; the defaults after
# `:-` exist so that a bare `docker compose config` still resolves.

name: konusbitr

services:
  # --------------------------------------------------------------- Postgres --
  # One database holds embeddings, full-text search and JSONB parse artifacts,
  # so an operator has exactly one thing to back up. Extensions are enabled by
  # the init script; tables are owned by migrations (Phase 03), never by this
  # file.
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-konusbitr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konusbitr}
      POSTGRES_DB: ${POSTGRES_DB:-konusbitr}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, before anything can connect.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-konusbitr}" -d "${POSTGRES_DB:-konusbitr}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ------------------------------------------------------------------ Redis --
  # The job queue, the progress pub/sub channel and rate-limit counters. AOF is
  # on because a queue that loses jobs on restart is worse than no queue.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ------------------------------------------------------------------ MinIO --
  # S3-compatible object storage, so the same code path runs against S3, R2 or
  # B2 in production with only S3_ENDPOINT changed.
  minio:
    # quay.io, not Docker Hub: MinIO stopped serving `minio/minio` there, and an
    # untagged image is not something a self-hoster's first command should
    # depend on either. Pinned so the stack is reproducible.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-konusbitr-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-konusbitr-root-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # `mc ready` probes /minio/health/live from inside the container. The
      # image no longer ships curl, and this is what MinIO documents.
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the bucket and an unprivileged access key, then exit 0.
  # Everything that follows depends on it having completed, so a first boot can
  # never race an upload against a missing bucket.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-konusbitr-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-konusbitr-root-secret}
      S3_BUCKET: ${S3_BUCKET:-konusbitr}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-konusbitr}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-konusbitr-dev-secret}
    entrypoint: ['/bin/sh', '/init.sh']
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro

  # -------------------------------------------------------------- Migrations --
  # One-shot: bring the schema up to date, then exit 0. Web and worker wait for
  # it, so a first `docker compose up` on an empty volume produces a database
  # that can be signed up against rather than one that 500s on the first query.
  # Idempotent, so every later `up` costs one round trip to Postgres.
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-konusbitr}:${POSTGRES_PASSWORD:-konusbitr}@postgres:5432/${POSTGRES_DB:-konusbitr}

  # -------------------------------------------------------------------- Web --
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Container hostnames override the localhost URLs in `.env`, which are
      # there for natively-run processes. See the header of `.env.example`.
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-konusbitr}:${POSTGRES_PASSWORD:-konusbitr}@postgres:5432/${POSTGRES_DB:-konusbitr}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # The browser is not on the Docker network. Presigned URLs — the direct
      # upload PUT and the GET the viewer streams the PDF from — are signed
      # against this origin instead, because SigV4 covers the Host header and a
      # URL signed for `minio:9000` cannot be rewritten after the fact.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
      OLLAMA_BASE_URL: http://ollama:11434
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ----------------------------------------------------------------- Worker --
  # The Python half of the pipeline: it consumes the `konusbitr:jobs` Redis
  # stream, walks a document from `queued` through parsing, chunking and
  # embedding to `ready`, and publishes progress the browser reads over SSE.
  #
  # With no embedding model configured — which is the default `.env` — chunks
  # are written without vectors and the documents are keyword-searchable; a
  # `reindex` fills the vectors in once a model is named. See `.env.example`.
  #
  # The port is published so that an operator can curl /health and /ready. It
  # serves nothing else, and nothing in the app calls it.
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: runtime
    restart: unless-stopped
    # Scaled to zero by the `advanced` profile's instructions above. Declared
    # here rather than left to `--scale` on the command line so that the
    # setting lives in `.env` alongside every other operator decision.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-konusbitr}:${POSTGRES_PASSWORD:-konusbitr}@postgres:5432/${POSTGRES_DB:-konusbitr}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
      WORKER_PORT: '8081'
      # Stable across restarts, and distinct per replica: a restarted worker
      # reclaims its own unacknowledged deliveries by consumer name. Compose
      # gives each container a stable hostname, which is the default.
    ports:
      - '${WORKER_PORT:-8081}:8081'
    # The Phase 12.4 memory ceiling, declared rather than hoped for.
    #
    # A 900-page scan must ingest without the worker's RSS passing two
    # gigabytes, and the way that is achieved is architectural: pages are
    # rendered on demand a batch at a time, thumbnails spill to a scratch
    # directory instead of being held, and a collection cycle runs between
    # batches. Stating the limit here is what turns a regression in any of
    # those into an `OOMKilled` on somebody's laptop rather than into a
    # production incident six months later.
    #
    # Compose applies this only under `deploy` with the v2 engine; it is
    # ignored by older ones, which is acceptable — it is a guard rail, not a
    # requirement for the stack to run.
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    healthcheck:
      # Probes the worker's own /health, which reports both the job loop's
      # heartbeat and Redis connectivity — so a process that is running but has
      # stopped consuming is reported unhealthy rather than merely "up".
      test: ['CMD', 'python', '-m', 'konusbitr_worker.health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ------------------------------------------------------ Profile: advanced --
  #
  # The same worker, built from the stage that installs the restrictively
  # licensed parsers. Everything else about it — the environment, the health
  # check, the consumer group — is identical, because the licence boundary is
  # the only difference between the two images and pretending otherwise would
  # make this a second deployment to keep in step.
  #
  # `ENABLE_ADVANCED_PARSERS` is passed explicitly rather than defaulted: the
  # Dockerfile stage fails the build without it, so an operator who reaches this
  # service gets the AGPL packages they asked for or a build error saying why
  # they did not — never an image that looks advanced and is not.
  worker-advanced:
    profiles: [advanced]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: worker-advanced
      args:
        ENABLE_ADVANCED_PARSERS: 'true'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-konusbitr}:${POSTGRES_PASSWORD:-konusbitr}@postgres:5432/${POSTGRES_DB:-konusbitr}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
      WORKER_PORT: '8081'
    ports:
      - '${WORKER_PORT:-8081}:8081'
    healthcheck:
      test: ['CMD', 'python', '-m', 'konusbitr_worker.health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ----------------------------------------------------- Profile: local-llm --
  ollama:
    image: ollama/ollama
    profiles: [local-llm]
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list > /dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s

  # One-shot: pull a chat and an embedding model so the offline stack is usable
  # the moment it comes up rather than on the first slow query.
  ollama-init:
    image: ollama/ollama
    profiles: [local-llm]
    restart: 'no'
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      # 1024-dimensional and multilingual, matching the width
      # `chunks.embedding` is declared at. See `.env.example`.
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      # Optional, and several gigabytes. Qwen2.5-VL is the open vision model
      # that returns bounding boxes, which is what Phase 12.3's advanced parser
      # needs — a description-only model produces elements nothing can cite.
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-}
    entrypoint: ['/bin/sh', '/pull-models.sh']
    volumes:
      - ./docker/ollama/pull-models.sh:/pull-models.sh:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-models:
