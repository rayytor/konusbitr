packages:
  - "apps/*"
  - "packages/*"
  # The eval harness is a workspace package so lint and typecheck see it too.
  - "evals"

# Postinstall scripts are denied by default. Anything listed here has been
# looked at and needs to run — all four fetch or link a platform-specific
# native binary.
allowBuilds:
  "@biomejs/biome": true
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true

# New releases are held back for a day as a supply-chain speed bump. Everything
# below was wanted before the window elapsed and was reviewed.
minimumReleaseAgeExclude:
  - lucide-react@1.45.0
  - zod@4.6.2
  - '@aws-sdk/client-s3@3.1131.0'
  - '@aws-sdk/s3-request-presigner@3.1131.0'
  - '@aws-sdk/lib-storage@3.1131.0'
