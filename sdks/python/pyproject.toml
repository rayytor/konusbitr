[project]
name = "konusbitr"
version = "0.1.0"
description = "Python client for the Konusbitr API — parse, extract, split and ask, with verified citations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Konusbitr" }]
keywords = ["pdf", "ocr", "rag", "citations", "konusbitr", "pdf.ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = ["httpx>=0.28"]

[project.urls]
Homepage = "https://github.com/rayytor/Konusbitr"
Documentation = "https://github.com/rayytor/Konusbitr/tree/main/sdks/python#readme"
Source = "https://github.com/rayytor/Konusbitr/tree/main/sdks/python"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.4", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konusbitr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated. Its formatting is the generator's decision, not ruff's.
"src/konusbitr/_generated.py" = ["E501", "RUF100"]
