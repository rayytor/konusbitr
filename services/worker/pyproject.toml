[project]
name = "konusbitr-worker"
version = "0.0.0"
description = "Konusbitr document pipeline: parse, OCR, chunk and embed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "redis>=5",
    "uvicorn>=0.52.4",
    "uvloop>=0.22.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.79.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konusbitr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
