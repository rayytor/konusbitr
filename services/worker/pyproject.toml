[project]
name = "konusbitr-worker"
version = "0.0.0"
description = "Konusbitr document pipeline: parse, OCR, chunk and embed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.35",
    "docling>=2.55",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    # The single interface to every model provider. Konusbitr never imports a
    # provider SDK: roles (chat, embedding, rerank, vision) are configured
    # independently and an operator can point any of them at OpenAI or at a
    # local Ollama with no code change. See `docs/adr/0002-model-router.md`.
    "litellm>=1.80",
    # ── The OCR tier (Phase 12.1) ────────────────────────────────────────────
    #
    # Every one of these is Apache-2.0, MIT or BSD-3, which is the constraint
    # rather than a coincidence: the default build has to stay cleanly
    # Apache-2.0-compatible, and the CI license audit fails the build if one of
    # them ever changes its mind. PyMuPDF and Marker are the obvious
    # alternatives and are both AGPL, which is why they live behind the
    # `advanced` Compose profile and not here.
    #
    # `rapidocr-onnxruntime` ships the PP-OCRv4 detection and recognition
    # weights inside the wheel, so the image needs no model download at build
    # or at run time — the same property `DOCLING_ARTIFACTS_PATH` gives Docling,
    # and the reason OFFLINE_MODE remains a claim rather than an aspiration.
    "deskew>=1.6.1",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.11",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.4.4",
    "pillow>=11",
    "pydantic-settings>=2.12.0",
    "pypdfium2>=4.30",
    "redis>=5",
    # Declared explicitly, though Docling would pull them in anyway: a
    # `tool.uv.sources` entry only binds a *direct* dependency, so without
    # these two lines the CPU-only index below is silently ignored and the
    # lockfile fills with multi-gigabyte CUDA wheels this worker cannot use.
    "torch>=2.4",
    "torchvision>=0.19",
    "uvicorn>=0.52.4",
    "uvloop>=0.22.1",
    "fast-langdetect>=1.0.1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.79.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    # Fixture corpus generation only. The PDFs under `fixtures/pdf/` are
    # committed, so a normal test run never reaches for this — it is needed by
    # `fixtures/generate.py` and by the 500-page test that builds its monster
    # on the fly rather than committing 20MB of it.
    "reportlab>=4.2",
    "ruff>=0.14.0",
    # The license audit. `tests/test_licensing.py` runs it over the *installed*
    # environment rather than over the lockfile, because a transitive
    # dependency that arrives with a restrictive license arrives at install
    # time and not at resolve time.
    "pip-licenses>=5.0",
]

[tool.uv.sources]
# CPU-only torch. Docling's layout models pull torch transitively; the default
# index serves CUDA wheels that are gigabytes larger and useless on the CPU-only
# machines this worker is budgeted for.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konusbitr_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"
markers = [
    # The fixture suite runs Docling over real PDFs: seconds, not milliseconds,
    # and it needs the layout model on disk. CI runs everything; `-m "not slow"`
    # is the loop to iterate in.
    "slow: runs the real parser over the fixture corpus",
]
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF002 flag characters that look like ASCII but are not — a dotless ı
# mistaken for an i, a full-width comma for a comma. That is a genuinely useful
# rule everywhere except in the two places whose whole subject is non-Latin
# text: the language router's tables and the tests that assert what a recogniser
# read off a Turkish, Arabic, Chinese or Japanese page. Suppressing it there is
# not a style concession — the alternative is escaping every such character,
# which would make an assertion about a sentence unreadable to anyone checking
# whether it is the right sentence.
"src/konusbitr_worker/parse/ocr/languages.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ocr_languages.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_multilingual_fixtures.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
